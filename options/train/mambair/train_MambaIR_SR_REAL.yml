# -------------------------
# MambaIR - Real Image Super-Resolution Training
# For real LR images (non-aligned)
# -------------------------

name: MambaIR_RealSR
model_type: MambaIRModel
num_gpu: auto
manual_seed: 99

dataset_root: &dataset_root "/home/eafm23/datasets/LRLPR/"
#dataset_index: &dataset_index "split_scenario_B.csv"
#dataset_index: &dataset_index "split_teste.csv"
dataset_index: &dataset_index "split_all.csv"

lq_size_base: &lq_size_base
  h: 32
  w: 64

# ---------------------------------------
# DATASET (real images are not aligned!)
# ---------------------------------------
datasets:
  train:
    task: SR
    name: UFPR_Real
    type: LPSRPlateDataset
    phase: 'training'
    use_amp: true
    io_backend:
      type: disk



    # DatasetConfig
    use_hflip: false   
    use_rot: false     
    scale: 2
    dataroot: *dataset_root
    index_file: *dataset_index


    # DataLoader
    use_shuffle: true
    num_worker_per_gpu: 1
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 1
    lq_size: *lq_size_base


  val:
    name: UFPR_RealVal
    type: LPSRPlateDataset
    phase: 'validation'
    scale: 2
    dataroot: *dataset_root
    index_file: *dataset_index
    lq_size: *lq_size_base
    io_backend:
      type: disk

# ---------------------------------------
# NETWORK: MambaIR (unchanged)
# ---------------------------------------
network_g:
  type: MambaIR
  upscale: 2
  in_chans: 3
  img_size: 96
  img_range: 1.
  d_state: 16
  embed_dim: 180
  depths: [6,6,6,6,6,6]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

# ---------------------------------------
# PATH
# ---------------------------------------
path:
  experiments_root: /home/eafm23/MambaLP/experiments/MambaIR_RealSR/
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~  
#resume_state: /home/machoski/Desktop/MambaLP/experiments/best.pth
#/home/eafm23/MambaLP/experiments/MambaIR_RealSR/models/best.pth

# ---------------------------------------
# TRAINING CONFIG
# ---------------------------------------
train:
  optim_g:
    type: Adam
    lr: !!float 2e-4 
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [ !!int 50000, !!int 100000, !!int 150000 , !!int 200000, !!int 250000, !!int 300000, !!int 350000] 
    gamma: 0.5

  total_iter: !!int 400000
  warmup_iter: -1

  viewer:
    enabled: false

  # ---------------------
  # Real-SR loss functions
  # ---------------------
  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 0.1
    reduction: mean

  perceptual_opt:
    type: PerceptualLoss
    perceptual_weight: 0.05
    contextual_weight: 0.5
    style_weight: 0.0

    layer_weights:
      '2': 0.01
      '7': 0.05
      '12': 0.1
      '21': 1.0

  ssim_opt:
    type: SSIMLoss
    loss_weight: 0.1
    window_size: 11
    max_val: 1.0
    reduction: mean

  ocr_opt:
    load: /home/eafm23/MambaLP/ocr/model.pth
    alphabet: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"
    loss_weight: 0.01
    input_size: [32, 96]

# ---------------------------------------
# VALIDATION
# ---------------------------------------
val:
  # OCR and image metrics are calculated at every validation milestone.
  val_freq: !!int 5000
  save_img: false

  ocr_metrics:
    enabled: true
    # Log prediction examples only when current_iter is divisible by this value.
    # Use the same value as val_freq to log examples at every milestone.
    example_freq: !!int 5000
    num_examples: 10
    top_k_errors: 10
    temporal_fusion:
      enabled: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true


# ---------------------------------------
# LOGGING
# ---------------------------------------
logger:
  print_freq: 500
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
